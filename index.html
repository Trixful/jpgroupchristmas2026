<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JP Group Christmas Invitation</title>
  <style>
    :root {
      --warm-bg: #ebe2cf;
      --transition-duration: 1100ms;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 375px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
    }

    .invitation {
      position: relative;
      width: 100%;
      height: 100svh;
      display: grid;
      place-items: center;
      background: #090909;
    }

    .video,
    .letter {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .video {
      z-index: 2;
      object-fit: cover;
      object-position: center;
      will-change: opacity;
    }

    .letter {
      z-index: 1;
      background: var(--warm-bg) url("letter.png") center / cover no-repeat;
      opacity: 0;
      transition: opacity var(--transition-duration) ease-in-out;
    }

    .invitation.transitioning .letter {
      z-index: 3;
      opacity: 1;
    }

    .invitation.show-letter {
      background: var(--warm-bg);
    }

    .invitation.show-letter .video {
      opacity: 0;
      visibility: hidden;
    }

    .invitation.show-letter .letter {
      z-index: 2;
      opacity: 1;
    }

    @media (min-width: 768px) {
      .letter {
        background-color: #eee5d2;
      }
    }

    @media (min-width: 1024px) {
      .letter {
        background-color: #ebe2cf;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --transition-duration: 300ms; }
    }
  </style>
</head>
<body>
  <main class="invitation" id="invitation">
    <video
      class="video"
      id="dove-video"
      src="dove video.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
      aria-label="Opening dove video"
    ></video>

    <section class="letter" id="letter" aria-label="Christmas party invitation">
    </section>
  </main>

  <script>
    const invitation = document.getElementById("invitation");
    const video = document.getElementById("dove-video");
    let transitionStarted = false;

    function showLetter() {
      if (transitionStarted) return;
      transitionStarted = true;
      invitation.classList.add("transitioning");

      window.setTimeout(() => {
        invitation.classList.remove("transitioning");
        invitation.classList.add("show-letter");
      }, 1100);
    }

    video.addEventListener("ended", showLetter);
    video.addEventListener("error", showLetter);

    video.play().catch(() => {
      window.setTimeout(showLetter, 2200);
    });

    window.setTimeout(showLetter, 25000);
  </script>
</body>
</html>
